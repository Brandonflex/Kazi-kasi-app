[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kazikasi"
version = "0.1.0"
description = "Geo-anchored hiring radar for Kenya — ingestion spine"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "psycopg[binary]>=3.1",
  "pypdf>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kazikasi = "kazikasi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
